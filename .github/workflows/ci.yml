name: Deterministic checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Identify checked revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and tracked-file hygiene
        run: |
          python scripts/verify_source_checksums.py
          python scripts/check_repo_hygiene.py
      - name: Install exact-pinned application and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run deterministic regression suite
        run: python -m pytest
      - name: Compile, import and compare installed policies
        run: |
          python -m compileall -q src
          python -c 'import medical_ai.api, medical_ai.engine, medical_ai.schemas'
          python scripts/verify_package_policies.py
