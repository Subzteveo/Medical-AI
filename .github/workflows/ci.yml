name: Deterministic checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Identify checked revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and tracked-file hygiene
        run: |
          python scripts/verify_source_checksums.py
          python scripts/check_repo_hygiene.py
      - name: Install exact-pinned application and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run strict influence type-safety gate
        run: python scripts/run_type_safety_gate.py --json-out /tmp/type-safe-influence-control.json
      - name: Preserve revision-bound type-safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-safe-influence-control-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/type-safe-influence-control.json
          if-no-files-found: error
      - name: Run deterministic regression suite
        run: python -m pytest
      - name: Run Alpha3 engineering harness CLI
        run: python -m medical_ai.evals.alpha3_evidence_fidelity --json-out /tmp/alpha3-evidence-fidelity.json
      - name: Preserve revision-bound Alpha3 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha3-evidence-fidelity-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/alpha3-evidence-fidelity.json
          if-no-files-found: error
      - name: Compile, import and compare installed policies
        run: |
          python -m compileall -q src
          python -c 'import medical_ai.api, medical_ai.engine, medical_ai.schemas'
          python scripts/verify_package_policies.py
