[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-ai-evidence-workbench"
version = "0.1.0a2.post1"
description = "Evidence-bound medical research and education workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "uvicorn==0.48.0",
]

[project.scripts]
medical-ai-serve = "medical_ai.server:main"
medical-ai-admin = "medical_ai.admin_cli:main"

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "pyright==1.1.414"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medical_ai = ["static/*.html", "policies/*.yaml"]


[tool.pyright]
include = [
  "src/medical_ai/schemas.py",
  "src/medical_ai/influence.py",
  "src/medical_ai/engine.py",
  "src/medical_ai/renderer.py",
  "src/medical_ai/connectors/base.py",
  "src/medical_ai/authority.py",
  "src/medical_ai/authority_policy.py",
  "src/medical_ai/authority_resolver.py",
  "src/medical_ai/settings.py",
  "src/medical_ai/server.py",
  "src/medical_ai/admin_cli.py",
  "src/medical_ai/evals/clinical_harm.py",
  "src/medical_ai/evals/answer_harm_adapter.py",
  "src/medical_ai/evals/medai_eval_002.py",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
